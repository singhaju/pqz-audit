[package]
name = "pqz-bl-dart"
version = "0.1.0"
edition = "2021"
description = "DART (Yu et al., IEEE TIFS 2025) auditing path as RUN code, without the zk-SNARK part"

# stand-alone crate (not part of any workspace)
[workspace]

[lib]
name = "pqz_bl_dart"
path = "src/lib.rs"

[[bin]]
name = "dart-bench"
path = "src/bin/dart-bench.rs"

[dependencies]
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.10.8"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
ff = "0.13.0"

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
