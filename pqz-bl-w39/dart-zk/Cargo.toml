[package]
name = "pqz-bl-w39-dart-zk"
version = "0.1.0"
edition = "2021"
description = "DART (Yu et al., IEEE TIFS 2025) auditing path as RUN code, 1 thread, plus a Groth16 (arkworks, BN254) proof of the ZKP.Prove relation (Eq. 5), work39"

# stand-alone crate (not part of any workspace)
[workspace]

[lib]
name = "pqz_bl_dart"
path = "src/lib.rs"

[[bin]]
name = "dart-bench"
path = "src/bin/dart-bench.rs"

[dependencies]
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.10.8"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
ff = "0.13.0"

# work39: Groth16 over BN254 (versions as in bench/pqz-bl-w30/lhcpm); NO `parallel` feature: single thread
ark-ff = { version = "=0.4.0", default-features = false }
ark-ec = { version = "=0.4.0", default-features = false }
ark-bn254 = { version = "=0.4.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.4.0", default-features = false }
ark-relations = { version = "=0.4.0", default-features = false }
ark-snark = { version = "=0.4.0", default-features = false }
ark-std = { version = "=0.4.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.4.0", default-features = false }
ark-crypto-primitives = { version = "=0.4.0", default-features = false, features = ["sponge"] }

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
