[package]
name = "pqz-integrated-w46"
version = "0.1.0"
edition = "2021"
publish = false
description = "w35 end-to-end driver (laptop prototype): w34 plus chunked R_RC with the AA finalization check (D3), B_{e,g} with sigma and MRoot(S) (D2), run proofs over whole chunks (D4) and the requester checks BlockCover/PruneValid (D5); see README.md"

# own workspace root (same as pqz-plonky3-w46), so no parent manifest is searched
[workspace]

[dependencies]
pqz_eval = { path = "../pqz-eval" }
pqz_ledger = { package = "pqz-ledger", path = "../pqz-ledger" }
pqz-plonky3-w36 = { package = "pqz-plonky3-w46", path = "../pqz-plonky3-w46" }
# same exact versions as pqz-plonky3-w36 (needed here for the prove call, the Goldilocks type, Matrix::height and the permutation trait)
p3-field = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-maybe-rayon = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"

[[bin]]
name = "w34"
path = "src/bin/w34.rs"

[[bin]]
name = "w35"
path = "src/bin/w35.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
